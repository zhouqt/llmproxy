# LLM Proxy configuration example.
#
# Copy to config.yaml, fill in API keys (or set as env vars), then run:
#   cargo run --release -- --config config.yaml
#
# Environment variable expansion: any `${VAR}` or `$VAR` reference is
# expanded from the process environment at startup. Bash-style
# `${VAR:-default}` is also supported — the literal `default` is used
# (with outer single/double quotes stripped) when VAR is unset or empty.
# This is how API keys are typically injected.

# ───────────────────────────────────────────────────────────────────────
# secrets: where ${VAR} references resolve from
# ───────────────────────────────────────────────────────────────────────
# By default every `${VAR}` in this file is expanded from the process
# environment at startup. The `secrets:` block adds a second, HIGHER
# priority source: a `.env`-format file on disk.
#
#   provider — none (default) | env | file
#       none — environment only. Same as `env`; `none` is what a config
#              without a `secrets:` block gets.
#       env  — environment only, spelled out explicitly.
#       file — read the file named by `file.path` FIRST; any `${VAR}`
#              found there resolves from the file. Variables NOT in the
#              file still fall back to the process environment.
#   file.path     — path of the `.env`-format file. Default: unset.
#                   May itself contain a `${VAR}`, which is resolved from
#                   the process environment (the overlay cannot describe
#                   where the overlay lives).
#   file.required — true (default) | false.
#                   true  — a missing/unreadable file aborts startup
#                           (fail fast: the proxy never silently starts
#                           without its keys).
#                   false — log a warning and continue with an empty
#                           overlay, falling back to the environment.
#
# File format (NAME=VALUE per line, deliberately NOT docker-compose's
# `env_file` rules — a secret is passed through byte-for-byte):
#   - blank lines and `#` comments are skipped;
#   - an optional `export ` prefix is stripped;
#   - the line is split on the FIRST `=`, so values may contain `=`;
#   - a value wrapped in a MATCHING pair of " or ' is unquoted;
#   - NO variable interpolation and NO trailing-`#` stripping (a `#`
#     inside a secret is a legal character);
#   - a repeated key replaces the earlier one;
#   - a line without `=` is skipped with a warning.
#
# Typical use: the container entrypoint unseals a TPM-sealed blob into
# the container's tmpfs at /run/secrets/llmproxy.env and the proxy reads
# it from there — so the plaintext key never sits in the container's
# process environment (`podman inspect` would show it there) and never
# lands in an image layer. See plans/feat-vault-secret-backend.md.
#
# secrets:
#   provider: file
#   file:
#     path: /run/secrets/llmproxy.env
#     required: true

# ───────────────────────────────────────────────────────────────────────
# server: incoming HTTP listener
# ───────────────────────────────────────────────────────────────────────
server:
  # Address:port the proxy binds to.
  #
  # In a CONTAINER, bind 0.0.0.0 — a loopback bind makes the published
  # port unreachable. The container-side listen is NOT the trust
  # boundary; restrict exposure on the HOST side instead, e.g.
  #   ports: "127.0.0.1:9090:9090"
  # and always set `api_key` below when the port is published.
  # 127.0.0.1 is only for bare-metal, non-container runs.
  # Default if omitted: 127.0.0.1:8080.
  listen: "0.0.0.0:8080"

  # Shared bearer token clients send via `Authorization: Bearer <key>`
  # (or `x-api-key: <key>`). Supports ${ENV_VAR} expansion. Leave unset
  # to disable authentication — the proxy then serves EVERY configured
  # provider key to anyone who can reach the port, and logs a loud
  # startup warning saying so. Only safe when the port is unreachable
  # from anywhere but the local machine.
  # An api_key that expands to an EMPTY string is rejected at startup:
  # that is what a `${VAR}` pointing at a missing secret looks like, and
  # it would otherwise leave the endpoint open to a bare
  # `Authorization: Bearer ` — remove the field to disable auth.
  api_key: "${LLMPROXY_API_KEY}"

  # Whether the client is told what the upstream said.
  #
  # true (the default) passes the upstream error body through, names the
  # failing backends in the `x-llmproxy-failed-providers` header, and
  # embeds the upstream text in an in-stream `event: error`. That is a
  # debugging convenience — and a disclosure surface: anyone holding the
  # shared bearer token learns the backend topology and the upstream
  # account's quota/auth details.
  #
  # false replaces all of it with generic wording. The operator still
  # sees the full detail in the logs and in `/admin/usage` — only the
  # client stops seeing it. Set this when more than one client shares
  # the token, or when the port is published beyond localhost.
  #
  # "All of it" includes the `event: error` frames the SSE adapters
  # synthesise from an upstream error object, and the errors that only
  # carry upstream text (transport errors, token-refresh messages).
  # Purely client-side errors keep their own wording.
  expose_upstream_details: true

# ───────────────────────────────────────────────────────────────────────
# proxy: outgoing proxy used by providers with `use_proxy: true`
# ───────────────────────────────────────────────────────────────────────
# Per-provider opt-in via `use_proxy: true` on each provider below.
# Any provider without it bypasses the global proxy and connects
# directly. Defaults to false, so by default no provider uses the
# proxy — enable it explicitly for the ones that need it.
#
# Supported schemes in `url`:
#   socks5h://host:port  — SOCKS5, remote DNS resolution (recommended)
#   socks5://host:port   — SOCKS5, local DNS resolution
#   http://host:port     — HTTP CONNECT
#   https://host:port    — HTTPS CONNECT
#
# proxy:
#   url: "socks5h://192.168.122.1:6666"
#   # timeout_secs: per-request timeout for proxied providers (seconds).
#   # Direct providers inherit this too — see build_direct_client.
#   # Default if omitted: 600.
#   timeout_secs: 600

# ───────────────────────────────────────────────────────────────────────
# user_agent: client identity presented to upstream LLM providers
# ───────────────────────────────────────────────────────────────────────
# User-Agent sent on outbound requests to upstream providers. Defaults to
# simulating the Claude Code client identity — `claude-cli/2.1.224
# (external, claude-vscode, agent-sdk/0.3.224)` — the exact string the
# real client reports when driven as an external agent, so gateways
# classify the proxy's traffic as coming from Claude Code instead of an
# unknown client (the bare `claude-code/<ver>` CLI format is not
# recognized). Override only if you need a custom identity. The
# github_copilot provider is unaffected: it sends
# `GitHubCopilotChat/<version>` regardless of this setting.
#
# user_agent: "claude-cli/2.1.224 (external, claude-vscode, agent-sdk/0.3.224)"

# ───────────────────────────────────────────────────────────────────────
# usage_capacity: in-memory ring buffer size for /admin/usage
# ───────────────────────────────────────────────────────────────────────
# Every /v1/messages request — streaming and non-streaming — appends
# one row (started_at / ended_at / provider / model / tokens / outcome
# / failed_providers) to an in-memory FIFO ring buffer that backs the
# /admin/usage endpoint. When the buffer is full the oldest row is
# evicted.
#
# Set `usage_capacity: 0` to disable the feature entirely — the
# request path keeps working, no rows are written, and `/admin/usage`
# reports an empty snapshot. Hard-capped at 1_000_000 rows (any value
# above that is silently clamped with a startup warning). Default:
# 100_000.
#
# usage_capacity: 100000

# ───────────────────────────────────────────────────────────────────────
# providers: backend LLM services the proxy can route to
# ───────────────────────────────────────────────────────────────────────
# Each provider is keyed by `name`; the `models:` section below refers
# to providers by this name. The `type` field selects which struct
# shape the rest of the entry must follow.

providers:
  # ─── github_copilot ──────────────────────────────────────────────────
  # Talks to GitHub Copilot's API using OAuth device flow. The first
  # request after a fresh install will print a one-time code; visit the
  # printed URL, paste the code, and the resulting token persists at:
  #   $XDG_DATA_HOME/llmproxy/github_token.json
  # (defaults to ~/.local/share/llmproxy/github_token.json)
  #
  # Routing: the proxy auto-routes by model name, defaulting to Copilot's
  # /v1/responses endpoint (the ecosystem default — Responses is replacing
  # Chat Completions). Exceptions, driven by the per-model /models cache:
  #   - a model advertised chat-only  -> /v1/chat/completions
  #   - gpt-5.x advertising both      -> /v1/chat/completions (EnterWorktree
  #     whitelist: the Responses path risks malformed tool args for these)
  #   - everything else               -> /v1/responses
  #   - cold cache (no /models data)  -> /v1/responses for ALL models
  # The /models snapshot is persisted to copilot_models.json next to the
  # token store, so a restart starts warm (and /v1/models reflects it
  # immediately). A 400 that says a model "is not accessible via the"
  # selected endpoint is treated as model-unsupported and falls back to
  # the next provider instead of surfacing to the client.
  #
  # Fields:
  #   name           — internal key referenced by `models:`
  #   vscode_version — User-Agent string sent to GitHub. Some Copilot
  #                    endpoints gate access by client version.
  #                    Default: "1.95.0".
  #   account_type   — "individual" | "business" | "enterprise".
  #                    Determines which Copilot SKU the proxy targets.
  #                    Default: "individual".
  #   token_store_key — optional. Encrypts the on-disk token store
  #                    (github_token.json) with AES-256-GCM, so the
  #                    volume holding it never contains a plaintext
  #                    GitHub/Copilot token. Value format: 64 hex
  #                    characters = 32 bytes, e.g.
  #                    `openssl rand -hex 32`. Deliver it through the
  #                    sealed .env like every other secret:
  #                      token_store_key: "${LLMPROXY_TOKEN_STORE_KEY}"
  #                    Unset (default) → the store is written as
  #                    plaintext JSON, exactly as before. A plaintext
  #                    store stays readable after the key is added —
  #                    the next save rewrites it encrypted. An empty
  #                    value is rejected at startup (it is a ${VAR}
  #                    pointing at a missing secret, not "no key").
  #   model_rewrite  — optional map: incoming-model-name → upstream-model-name.
  #                    Empty (default) accepts any model name verbatim —
  #                    the proxy forwards the Anthropic `model` value as-is
  #                    to Copilot's Chat Completions endpoint. A non-empty
  #                    table is an explicit allow-list: only model names
  #                    present as keys are considered servable, and the
  #                    mapped value is sent upstream (useful when routing
  #                    `claude-sonnet-4.6` to a Copilot-side alias).
  #   use_proxy      — see top-of-file proxy section. Default: false.
  - name: copilot
    type: github_copilot
    vscode_version: "1.95.0"
    account_type: individual
    # token_store_key: "${LLMPROXY_TOKEN_STORE_KEY}"
    model_rewrite: {}
    use_proxy: true

  # ─── anthropic (native Anthropic Messages passthrough) ──────────────
  # Talks to any backend exposing the native Anthropic Messages API
  # (i.e. POST /v1/messages with anthropic-version header). The proxy
  # forwards the request body verbatim and streams the response
  # unchanged — no request/response translation. Use this for
  # OpenRouter's `/api/v1/messages` endpoint, AWS Bedrock with an
  # Anthropic-compatible adapter, or any other gateway speaking
  # Anthropic Messages without conversion.
  #
  # For OpenAI Chat Completions-style upstreams use `type: openai_compat`
  # below instead.
  #
  # Fields:
  #   name          — internal key
  #   api_key       — bearer token (supports ${ENV_VAR})
  #   api_base      — base URL up to but not including `/v1/messages`,
  #                   defaults to https://openrouter.ai/api/v1
  #   model_rewrite — optional map: incoming-model-name → upstream-model-name.
  #                   Empty (default) accepts any model name verbatim;
  #                   a non-empty table is an explicit allow-list (the
  #                   router skips this provider for unmapped names).
  #   use_proxy     — see proxy section. Default: false.
  #   thinking_when_absent — `disabled` (default) | `omit` | `effort_low`.
  #                   What to inject when the client sent no thinking
  #                   field; see the detailed comment below.

  - name: openrouter_anthropic
    type: anthropic
    api_key: "${OPENROUTER_API_KEY}"
    api_base: "https://openrouter.ai/api/v1"
    use_proxy: true
    # `provider_ignore` is honored by both `openai_compat` and `anthropic`
    # provider types when their `api_base` points to `openrouter.ai`. The
    # field is injected as `provider: {ignore: [...]}` into the request
    # body so OpenRouter skips the listed backend providers at routing
    # time (useful when a specific upstream is broken or misconfigured
    # and you can't gate it server-side via the OpenRouter team account).
    # Empty list (default) omits the `provider` key entirely.
    # On non-OpenRouter `api_base` values the field is logged as a warning
    # at startup and the wire body stays clean (strict Anthropic-compat
    # backends like DeepSeek reject unknown top-level fields with 400).
    provider_ignore:
      - "Inceptron"
    # `provider_allow` is the allowlist counterpart, injected as
    # `provider: {only: [...]}`. OpenRouter treats `only` as a HARD ceiling:
    # if none of the listed providers can serve the requested model the
    # request fails with 503 ("No available model provider meets your
    # routing requirements"). llmproxy treats 503 as cooldownable, so a
    # mistyped slug silently cools this provider down and the router falls
    # through to the next provider in the chain rather than reporting a
    # config error — watch `x-llmproxy-failed-providers` for
    # `openrouter_anthropic:503` after changing this list.
    # Slugs are passed through verbatim (no normalization); copy the exact
    # slug from the model's page on openrouter.ai. Note a BASE slug such
    # as "deepinfra" matches every endpoint of that provider including
    # variants like "deepinfra/turbo" — use a suffixed slug to pin one
    # endpoint. When both lists are set, both sub-fields are forwarded in
    # the same `provider` object and the proxy does not intersect them.
    provider_allow:
      - "DeepInfra"
      - "Together"
    # `thinking_when_absent` — what to send when the CLIENT request has
    # no `thinking` field (or an explicit null). Values:
    #   disabled (default) — inject {"type":"disabled"} into `thinking`.
    #   omit               — leave the body untouched; wire-identical to
    #                        the behavior before this option existed.
    #   effort_low         — send NO `thinking` at all; inject
    #                        {"output_config":{"effort":"low"}} when the
    #                        request also has no `output_config`. For
    #                        upstreams that force thinking on and reject
    #                        `thinking:{type:"disabled"}` outright, but
    #                        honor the effort knob — e.g. MiniMax
    #                        M3.1-Flash, whose default effort is `max`
    #                        and whose 141 KB classifier-shaped requests
    #                        drop from ~20 s to ~3 s at `low`.
    #
    # Why: several third-party Anthropic-compatible backends (DeepSeek,
    # GLM/Z.ai, MiniMax, Qwen compat layers) interpret an OMITTED
    # `thinking` as "reasoning ON", so a non-streaming classifier-style
    # request pays for a full thinking pass. The real Anthropic API
    # treats omission and `disabled` as equivalent, so this is a no-op
    # there; the benefit is entirely on compat backends. This is on by
    # default — set `omit` per provider only when you need byte-identical
    # legacy outbound requests.
    #
    # The trigger is strictly ABSENCE. Explicit `enabled`, `adaptive`
    # (which Claude Code sends for its main requests) and `disabled` all
    # pass through unchanged — rewriting `adaptive` to `disabled` would
    # switch off the primary model's reasoning. `effort_low` additionally
    # requires `output_config` to be absent too, so a client that chose
    # an effort level is never overridden.
    #
    # Fallback: if the upstream answers 400 and the error blames the
    # injected field (`thinking` for `disabled`, `output_config`/`effort`
    # for `effort_low`), the proxy drops that field and retries once.
    # That retry runs at the upstream's DEFAULT reasoning/effort setting,
    # so it gets no latency benefit — check for the fallback log line
    # before assuming this option is paying off for a given provider.
    #
    # OpenAI-family providers (openai_compat / openai_responses) do NOT
    # support this key: their equivalent is `reasoning_effort:"none"` /
    # `reasoning:{effort:"none"}`, which has a different (and
    # model-dependent) support matrix. See
    # plans/feat-disable-thinking-when-absent.md §3.7.
    # thinking_when_absent: omit

  - name: minimax
    type: anthropic
    api_key: "${MINIMAX_API_KEY}"
    api_base: "https://api.minimaxi.com/anthropic"
    # MiniMax M3.1-Flash always thinks and 400s on
    # `thinking:{type:"disabled"}`; switch this provider to the effort
    # knob instead:
    # thinking_when_absent: effort_low
    model_rewrite:
      "claude-haiku-4.6":  "MiniMax-M2.7"
      "claude-sonnet-4.6": "MiniMax-M3"
      "claude-opus-4.6":    "MiniMax-M3"

  # ─── openai_compat ───────────────────────────────────────────────────
  # Any OpenAI-Chat-Completions-compatible endpoint. Used for DeepSeek,
  # MiniMax, OpenCode Zen, and similar gateways.
  #
  # Fields:
  #   name          — internal key
  #   api_key       — Bearer token (supports ${ENV_VAR})
  #   api_base      — base URL up to but not including /chat/completions,
  #                  e.g. https://api.deepseek.com/v1
  #   model_rewrite — optional map: incoming-Claude-name → upstream-model-name.
  #                  If the requested model name has an entry here, the
  #                  proxy sends the rewritten value upstream. If absent,
  #                  the original name is forwarded as-is. Providers with
  #                  an empty rewrite table accept any model name verbatim
  #                  (the router skips them when a non-empty upstream-
  #                  model mapping is required — see `can_serve_model`).
  #   use_proxy     — see proxy section. Default: false.
  #   provider_ignore — optional list of OpenRouter backend-provider slugs
  #                  to exclude (e.g. ["Azure"]). Injects
  #                  `provider: {ignore: [...]}` only when api_base points
  #                  at openrouter.ai; ignored with a startup warning on
  #                  other backends (DeepSeek etc. 400 on unknown fields).
  #                  Default: empty (no injection).
  #   provider_allow  — optional list of OpenRouter backend-provider slugs
  #                  to RESTRICT routing to (allowlist). Injects
  #                  `provider: {only: [...]}` only when api_base points
  #                  at openrouter.ai; same host gate and startup warning
  #                  as provider_ignore. `only` is a hard ceiling — an
  #                  unsatisfiable list makes OpenRouter return 503, which
  #                  llmproxy treats as cooldownable (silent fallback, not
  #                  a config error). Default: empty (no injection).
  #   reasoning_echo — when true, thinking requests have every historical
  #                  assistant message padded with `reasoning_content: ""`
  #                  so DeepSeek-V4-style upstreams in thinking mode
  #                  accept cross-model history (redacted_thinking /
  #                  plain-text / tool-only turns) instead of 400ing
  #                  with `reasoning_content ... must be passed back`.
  #                  Only enable on upstreams that tolerate the field on
  #                  empty-reasoning turns. Default: false (strict OpenAI
  #                  spec upstreams may reject the non-standard field).

  - name: deepseek
    type: openai_compat
    api_key: "${DEEPSEEK_API_KEY}"
    api_base: "https://api.deepseek.com/v1"
    model_rewrite:
      "claude-haiku-4.6":  "deepseek-v4-flash"
      "claude-sonnet-4.6": "deepseek-v4-flash"
      "claude-opus-4.6":    "deepseek-v4-pro"

  # OpenCode Zen — free-tier public LLM gateway. Free accounts can only
  # call `-free` models (hy3-free, mimo-v2.5-free, deepseek-v4-flash-free,
  # ...); paid-model requests return 401 CreditsError. The rewrites below
  # map Claude-style names to free model IDs so the provider works as a
  # fallback for paid Claude models. `reasoning_echo: true` lets
  # thinking-enabled requests survive cross-model history that contains
  # redacted_thinking or plain-text assistant turns (Anthropic passthrough
  # produces both, and opencode_zen's DeepSeek backend rejects them with
  # `reasoning_content ... must be passed back` otherwise).
  - name: opencode_zen
    type: openai_compat
    api_key: "${OPENCODE_API_KEY}"
    api_base: "https://opencode.ai/zen/v1"
    reasoning_echo: true
    model_rewrite:
      "deepseek-v4-flash-free": "deepseek-v4-flash-free"
      "claude-haiku-4.6": "deepseek-v4-flash-free"
      "claude-sonnet-4.6": "deepseek-v4-flash-free"
      "claude-opus-4.6": "deepseek-v4-flash-free"

  # OpenRouter Chat-Completions side. Pairs with the `anthropic`
  # openrouter_anthropic provider above for fallback.
  - name: openrouter_openai
    type: openai_compat
    api_key: "${OPENROUTER_API_KEY}"
    api_base: "https://openrouter.ai/api/v1"
    # OpenRouter-specific: exclude backend providers that are misconfigured
    # or unreliable. Values are provider slugs (case-sensitive), e.g.
    # "Azure", "Together", "Fireworks". Only effective when api_base points
    # to openrouter.ai; on other OpenAI-compat backends the field is ignored
    # and a startup warning is logged (strict validators like DeepSeek would
    # reject unknown top-level fields with 400). Leave empty (or omit) to
    # allow all providers.
    provider_ignore:
      - "Azure"
    # Allowlist counterpart — see the `openrouter_anthropic` block above
    # for the full caveat. A base slug admits every endpoint variant of
    # that provider, so this list restricts *which providers* may serve the
    # request, not which single endpoint.
    provider_allow:
      - "DeepInfra"
    model_rewrite:
      "gpt-4o":            "openai/gpt-4o"
      "claude-haiku-4.6":  "anthropic/claude-haiku-4.5"
      "claude-sonnet-4.6": "anthropic/claude-sonnet-4.5"
      "claude-opus-4.6":   "anthropic/claude-opus-4.7"

  # ─── openai_responses ────────────────────────────────────────────────
  # Any backend exposing OpenAI's Responses API (POST /v1/responses).
  # Used for direct OpenAI GPT-5.x access (which requires /v1/responses
  # rather than /v1/chat/completions) and any reverse proxy that exposes
  # the same endpoint.
  #
  # Conversion is Anthropic Messages ↔ Responses API: system →
  # instructions, messages[] → flat input[] (with tool_use/result folded
  # into function_call / function_call_output items), thinking.budget_tokens
  # → reasoning.effort. Streaming is translated event-by-event
  # (response.output_text.delta → content_block_delta,
  # response.function_call_arguments.delta → input_json_delta, etc.).
  #
  # Fields:
  #   name          — internal key
  #   api_key       — Bearer token (supports ${ENV_VAR})
  #   api_base      — base URL up to but not including /responses,
  #                   e.g. https://api.openai.com/v1
  #   model_rewrite — optional map: incoming-model-name → upstream-model-name.
  #                   Empty (default) accepts any model name verbatim;
  #                   a non-empty table is an explicit allow-list.
  #   use_proxy     — see proxy section. Default: false.
  #
  # NOTE: GitHub Copilot also speaks the Responses API but routes
  # automatically per-model by its `/models` cache — see the github_copilot
  # section above. Under that policy responses is the default and chat is
  # chosen only for chat-only models or the EnterWorktree whitelist. No
  # configuration flag needed here.
  - name: openai_direct
    type: openai_responses
    api_key: "${OPENAI_API_KEY}"
    api_base: "https://api.openai.com/v1"
    model_rewrite:
      "gpt-5":      "gpt-5"
      "gpt-5-mini": "gpt-5-mini"
      "gpt-5.5":    "gpt-5.5"
    use_proxy: false

# ───────────────────────────────────────────────────────────────────────
# models: client-facing model names mapped to a routing chain
# ───────────────────────────────────────────────────────────────────────
# `name` is what clients send in the `model` field of /v1/messages.
# The proxy walks the chain [primary, fallback_chain...] in order,
# skipping any provider currently in cooldown, and returns the first
# successful response.
# YAML allows duplicate keys; the last one wins — for entries in a map
# (e.g. two identical `model_rewrite` keys) and for a repeated field in
# one block (e.g. two `name:` lines), which older versions rejected.
# Left in to preserve any operator overrides that target this exact slot.
#
# Fields:
#   name                    — client-facing model name (the value clients
#                             send in `model`). Any string.
#   primary                 — provider name tried first.
#   fallback_chain          — ordered list of provider names tried when
#                             the current one returns a cooldownable
#                             error (429, 401, 408, 404, 5xx).
#   cooldown_seconds        — TTL on the per-provider cooldown set after
#                             a cooldownable error. Default: 300 (5 min).
#                             After the TTL the provider is retried.
#   max_retries_per_provider — how many times to retry the same provider
#                             (across cooldown cycles) before moving to
#                             the next in the chain. Default: 2.
#   max_retries_total       — overall cap across the whole chain. When
#                             reached the request fails with
#                             AllProvidersFailed carrying the last
#                             upstream error. Default: 2.
models:
  - name: claude-haiku-4.6
    primary: deepseek
    fallback_chain:
      - copilot
    cooldown_seconds: 300
    max_retries_per_provider: 2

  - name: claude-sonnet-4.6
    primary: deepseek
    fallback_chain:
      - openrouter_openai
      - copilot
      - deepseek
      - minimax
    cooldown_seconds: 300
