version: 2

# Dependency-drift backstop. `security-audit.yml` is the hard gate (fails the
# check); Dependabot is what actually opens the fix PR. Both read the same
# RustSec advisories (GitHub's advisory DB ingests RustSec), so the two agree
# on what is vulnerable.
#
# The `cargo` entry groups every bump into one weekly PR instead of a dozen;
# `github-actions` does the same for the workflow actions. Both ecosystems
# are grouped with a `patterns: ["*"]` catch-all, so a week yields exactly
# two PRs (one cargo, one actions) no matter how many actions are stale.
# Ungrouped, five actions meant five separate PRs (#46-#50) -- five CI runs
# and five reviews for the same one-line version bump.
#
# The `cargo` group deliberately does NOT use `update-types`/semver pinning:
# a group merges a major bump (axum 0.7 -> 0.8) with the routine patch
# bumps, so the PR is no longer auto-mergeable and has to be read. That is
# intended -- those majors are real migrations, not noise.
#
# Manual step this file CANNOT do (repo admin): Settings -> Code security ->
# enable "Dependabot alerts" and "Dependabot security updates". This config
# only controls *version* update PRs; security alerts are a repo setting.
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      action-dependencies:
        patterns: ["*"]
  # NOTE: there is deliberately NO `docker` ecosystem here.
  #
  # The base images in the Dockerfile are pinned by digest, and the
  # obvious way to keep them current is to let Dependabot move the pin
  # whenever the tag is rebuilt. That is wrong for this repository: a
  # rebuilt tag is not a reason to move the pin. `rust:1-alpine` is
  # rebuilt constantly, so that policy produces a pull request per
  # rebuild -- noise that trains everyone to ignore the channel that
  # would have carried a real security update.
  #
  # The pin moves for one reason instead: the pinned image has a CVE
  # that a newer build has fixed. The `base-image-cve` job in
  # `.github/workflows/refresh-pins.yml` scans the pinned digest, finds
  # the CVE, checks whether the current build of the tag has fixed it,
  # and opens the pull request. A rebuild without a CVE behind it leaves
  # the pin alone.
  #
  # To follow a tag by hand (a one-off, for instance), move the pin
  # deliberately:
  #   tools/check-base-digests.py --resolve
  #   tools/check-base-digests.py --set <image>@<digest>

