name: docker

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign asks GitHub's OIDC provider for a
      # short-lived certificate that says who this workflow is. No
      # signing key exists anywhere to leak -- the credential is minted
      # for this one run and expires with it.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Keep the GITHUB_TOKEN out of .git/config: the image build
          # runs third-party build scripts, and a leaked credential in
          # the build context is a credential in the build.
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=llmproxy
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the pushed image by digest, keyless, with GitHub's OIDC
      # provider. The signature lands in the registry next to the image.
      #
      # The certificate identity is pinned to THIS repository's workflow
      # path, so a signature minted by some other workflow (or by a fork
      # that somehow got id-token: write) does not verify against it.
      # cosign v3 dropped --certificate-identity* from `sign` (they are
      # verify-side flags now), so the identity is enforced by the
      # verification step below instead: sign freely, then prove the
      # signature really carries this repository's identity.
      #
      # Deploy side must verify before running the image:
      #   cosign verify \
      #     --certificate-identity-regexp \
      #       "^https://github.com/${{ github.repository }}/.github/workflows/docker.yaml@.*" \
      #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      #     <registry>/<repo>@sha256:<digest>
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned exactly, like every other tool here: the installer
          # would otherwise take "whatever is latest", and a cosign
          # release that changes the bundle format or the verify flags
          # would then change what this repository signs. v3.1.4 is the
          # first v3.1 line with the bundle-verification bypass fix
          # (GHSA-fx35-mq7g-6g98).
          cosign-release: v3.1.4

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      # Prove the signature, right here, against this repository's
      # identity. Without this the identity constraint would only exist
      # in a comment, and the deploy side is not implemented yet -- so
      # this step is where the constraint is actually enforced.
      - name: Verify the signature
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp \
              "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker.yaml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      # The image must be auditable from the outside. `cargo auditable`
      # embeds the dependency list in the binary; this asserts that a
      # scanner actually SEES it. Without this step, "the binary carries
      # its dependency list" is a claim rather than a fact -- and the
      # whole point of embedding it is that Trivy/Grype can find the
      # Rust crates in an otherwise opaque binary.
      #
      # Only on push: on a pull request the image is built but not
      # pushed, so there is nothing to pull back and scan.
      - name: Scan the image
        if: github.event_name != 'pull_request'
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scan-type: image
          scanners: vuln
          format: json
          output: trivy-image.json
          exit-code: "0"
        env:
          # The package lives in this repository's registry; reading it
          # back needs the same token that pushed it.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"

      - name: The scanner must see the Rust dependencies
        if: github.event_name != 'pull_request'
        run: |
          if [ ! -f trivy-image.json ]; then
            echo "::error::the scan produced no result file -- the scanner did not run"
            exit 1
          fi
          # Trivy reports crates.io packages as one result of type
          # "cargo" -- that result is the list cargo-auditable embedded.
          groups=$(grep -c '"Type": "cargo"' trivy-image.json || true)
          echo "cargo results reported by the scanner: $groups"
          if [ "$groups" -eq 0 ]; then
            echo "::error::the scanner found no cargo packages in the image -- cargo-auditable's data is not being read"
            exit 1
          fi
          for crate in rustls serde tokio; do
            if ! grep -q "\"$crate\"" trivy-image.json; then
              echo "::error::the scanner did not report the $crate crate"
              exit 1
            fi
          done
          echo "ok: the scanner sees the Rust dependencies of the image"
