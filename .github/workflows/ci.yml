name: ci

# The build/test gate for this repository. The repository had a docker
# workflow and a security audit workflow, but nothing that actually
# compiled and tested the crate on a push -- so a broken build could sit
# on a branch until someone noticed. This is that missing layer, plus the
# dependency-policy checks that belong next to it.
#
# Five jobs, each covering one link of the chain:
#   build-test          -- the code compiles and the tests pass
#   coverage            -- the >97% region bar still holds
#   dependency-audit    -- no known advisory, no unexpected license, no
#                          unvetted dependency, and an SBOM to hand to a
#                          scanner
#   sandbox-canary      -- the *compile* step is proven to be network-isolated
#   lock-drift          -- no dependency was moved backwards

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same images the Dockerfile pins. docker.io rather than a mirror: the
  # CI runner reaches Docker Hub directly, and the published image should
  # come from the same place the build did. The build host cannot reach
  # docker.io, so it overrides the registry with the same digest (see the
  # Dockerfile header).
  RUST_IMAGE: docker.io/library/rust:1-alpine@sha256:b1d5dd5a22a09404d3e798c0cf051b689077360374eb505fa5bb93c479693d87

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are SHA-pinned (see security-audit.yml for the rationale).
      # `persist-credentials: false` keeps the GITHUB_TOKEN out of
      # .git/config, so a compromised build script cannot push to the repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustc --version
          cargo --version
          cargo fmt --version

      # A moved tag is not a defect: the base image pin moves for a CVE,
      # not because upstream rebuilt the image (which it does constantly).
      # So this check reports a drift, it does not fail -- a red build
      # over a rebuild nobody asked for trains people to ignore red
      # builds.
      #
      # A pin that could NOT be checked is the opposite case: the script
      # exits 2 and the pins are unverified, so the job fails. An
      # unverified pin is not a verified pin.
      #
      # Exit 2 also wins when both happen at once -- one pin drifted and
      # another could not be reached. The script decides the "could not
      # check" case first, because exit 1 means "every pin was checked
      # and one merely moved", and treating a partly-verified run as
      # exit 1 would leave the unchecked pin green behind a moved tag.
      #
      # The thing that *does* fail on a vulnerable image is the monthly
      # CVE scan in refresh-pins.yml.
      - name: Check base image digests
        run: |
          rc=0
          tools/check-base-digests.py || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "::warning::a base image tag moved; the pin stays until a CVE requires it to move"
          elif [ "$rc" -eq 2 ]; then
            echo "::error::the base image pins could not be verified (a registry was unreachable, or a pin is malformed)"
            exit 1
          fi

      # The exit-code logic itself, offline: no registry is contacted, so
      # this proves the "could not check" case is never mistaken for
      # "the tag moved". Without it, the ordering above would only ever
      # be exercised by a real registry outage.
      - name: Self-test the base image pin check
        run: tools/check-base-digests.py --selftest

      # `cargo fetch` downloads and verifies checksums against Cargo.lock.
      # It compiles nothing, so no third-party build.rs runs here.
      - name: Fetch dependencies
        run: cargo fetch --locked

      # `--offline` proves the build needs nothing beyond what was
      # checksum-verified above; `--locked` proves the lock file was not
      # rewritten to match a different manifest.
      #
      # NOTE: `--offline` is NOT a sandbox. build.rs still runs here, with
      # full network access. The actual isolation is the Dockerfile's
      # `RUN --network=none` layer; the sandbox-canary job below proves
      # that layer holds. Do not read `--offline` as a security control.
      - name: Build
        run: cargo build --offline --locked --all-targets

      - name: Test
        run: cargo test --offline --locked --lib --bins --tests

      # The canary lives in its own workspace, so the repo-wide
      # `cargo fmt --all` does not reach it. This one IS clean, so it is
      # a real gate.
      - name: Format check (sandbox-canary)
        run: cargo fmt --manifest-path tools/sandbox-canary/Cargo.toml -- --check

      # The main tree has pre-existing rustfmt drift (~580 hunks across
      # 20 files, pre-dating this workflow), so this step is advisory:
      # it reports the drift without failing the build. Promoting it to a
      # hard gate means reformatting the tree in its own commit first --
      # do not mix that into a supply-chain change.
      - name: Format check (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

  dependency-audit:
    name: Dependency policy and SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # cargo-deny and cargo-vet are crates.io binaries that run with full
      # permissions, exactly like the build scripts they audit. They are
      # pinned to an exact version and installed with --locked so the
      # bytes are checksum-verified against the crate's own Cargo.lock.
      # Bumping either one is a deliberate act, not a floating update.
      - name: Install cargo-deny
        run: cargo install --locked --version 0.20.2 cargo-deny

      - name: Install cargo-vet
        run: cargo install --locked --version 0.10.3 cargo-vet

      - name: Install cargo-cyclonedx
        run: cargo install --locked --version 0.5.9 cargo-cyclonedx

      # cargo-deny needs the crates.io index (for license metadata) and
      # the RustSec advisory DB. The index comes from the fetch above;
      # the advisory DB is fetched from GitHub.
      - name: Fetch dependencies
        run: cargo fetch --locked

      # A known advisory, a yanked crate, an unexpected license, or a
      # dependency from an unknown source (a git URL -- which Cargo.lock's
      # checksums do NOT cover) all fail here.
      - name: cargo-deny
        run: cargo deny check

      # cargo-vet is a ledger, not a barrier. This job does NOT claim
      # that any dependency has been manually audited: supply-chain/audits.toml
      # is empty, and every current dependency is covered by a version-pinned
      # exemption in supply-chain/config.toml.
      #
      # What it does assert is real, and it is what a new dependency
      # hits: a dependency that is neither audited nor exempted (or one
      # whose version moved off its pin) fails the build. So the step is
      # named for what it is -- an exemption ledger -- rather than for a
      # claim about manual auditing that nobody is making.
      - name: cargo-vet (exemption ledger)
        run: cargo vet

      # The same SBOM that is baked into the image, published as a build
      # artifact so it can be scanned without pulling the image.
      #
      # `--format json` picks the JSON encoding (the default is XML) and
      # `--override-filename` names the file. There is no --output-file:
      # the filename may not contain a path separator, so the file lands
      # in the current directory.
      - name: Generate SBOM
        run: cargo cyclonedx --format json --override-filename sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error

  coverage:
    name: Coverage (>97% regions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # cargo-llvm-cov needs the llvm-tools-preview component that matches
      # the toolchain. Same pinning rule as the other tools.
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install --locked --version 0.9.1 cargo-llvm-cov

      # The project's coverage bar is >97% REGIONS (docs/TEST_PLAN.md).
      # --fail-under-regions is the flag that matches that bar; the
      # line/function percentages are not what the project tracks.
      - name: Coverage
        run: cargo llvm-cov --lib --bins --tests --fail-under-regions 97

  sandbox-canary:
    name: Sandbox isolation self-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The canary's build.rs probes whether the compile step can reach
      # the network and whether credential-shaped env vars are present.
      #
      # It is tested in BOTH directions, because a canary that always
      # passes proves nothing:
      #   1. with the network reachable it MUST fail (it detected a breach)
      #   2. with --network none it MUST pass (isolation actually holds)

      # The negative test has to fail *because of the canary*. A build
      # that fails for any other reason (a typo in the canary crate, a
      # missing lock file) also exits non-zero -- and then the positive
      # test below would "prove" nothing about isolation. So the log is
      # captured and the canary's OWN failure marker is required in it.
      #
      # The marker is the message from the panic in
      # tools/sandbox-canary/build.rs ("隔离已被打破"), NOT the crate
      # name: cargo prints "Compiling sandbox-canary" and the build.rs
      # path for any failure of this crate, so grepping for the crate
      # name would match a compile error in the canary itself and the
      # step would pass while proving nothing.
      - name: Canary must FAIL when the network is reachable
        run: |
          set -o pipefail
          log=$(mktemp)
          if docker run --rm \
              -v "$GITHUB_WORKSPACE:/w" -w /w/tools/sandbox-canary \
              -e CARGO_TARGET_DIR=/tmp/canary-net \
              "$RUST_IMAGE" \
              cargo build --offline --locked 2>&1 | tee "$log"; then
            echo "::error::sandbox-canary passed with the network reachable -- it does not detect a breach, so the positive test below would be meaningless"
            exit 1
          fi
          if ! grep -q '隔离已被打破' "$log"; then
            echo "::error::the canary build failed, but not because of the canary -- the isolation test proved nothing"
            cat "$log"
            exit 1
          fi
          echo "ok: the canary correctly failed with the network reachable"

      - name: Canary must PASS with no network
        run: |
          set -eu
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE:/w" -w /w/tools/sandbox-canary \
            -e CARGO_TARGET_DIR=/tmp/canary-isolated \
            "$RUST_IMAGE" \
            cargo build --offline --locked
          echo "ok: the canary passed under --network none"

  policy-selftest:
    name: Policy self-test (the checks must go red)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The same pinned versions the dependency-audit job uses: a
      # self-test that exercises a different version of the tool proves
      # nothing about the version that gates the build.
      - name: Install cargo-deny
        run: cargo install --locked --version 0.20.2 cargo-deny

      - name: Install cargo-vet
        run: cargo install --locked --version 0.10.3 cargo-vet

      # Every control in this repository is a gate that is supposed to
      # FAIL on a violation. A gate that has never been seen failing is
      # indistinguishable from a gate that is silently broken. This job
      # injects one violation per case and asserts that the tool refuses
      # it -- and asserts first that the unmodified tree passes, or the
      # red cases would prove nothing.
      #
      # The script reports a case it could not run as SKIP. On this
      # runner nothing is skipped (python3 is present), so a SKIP here
      # means the self-test degraded silently.
      - name: The checks must refuse a violation
        run: |
          set -o pipefail
          tools/policy-selftest.sh | tee policy-selftest.log
          if grep -q '^SKIP:' policy-selftest.log; then
            echo "::error::a self-test case was skipped; the checks are not all covered"
            exit 1
          fi

      # The container scanner has to be able to go red as well. An old
      # Alpine release carries vulnerabilities that have been fixed
      # since; if Trivy reported nothing on it, a clean result on the
      # pinned images would mean nothing at all.
      #
      # The result file is written instead of relying on the exit code:
      # a network failure also exits non-zero, and that is not the same
      # thing as "found vulnerabilities".
      - name: Scan a deliberately old image
        id: trivy_red
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker.io/library/alpine:3.12
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: trivy-old-image.json
          exit-code: "0"
        env:
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"

      - name: The scanner must report findings on a vulnerable image
        run: |
          if [ ! -f trivy-old-image.json ]; then
            echo "::error::the scan produced no result file -- the scanner did not run"
            exit 1
          fi
          count=$(grep -c '"Severity": "HIGH"' trivy-old-image.json || true)
          count_critical=$(grep -c '"Severity": "CRITICAL"' trivy-old-image.json || true)
          echo "HIGH: $count  CRITICAL: $count_critical"
          if [ "$count" -eq 0 ] && [ "$count_critical" -eq 0 ]; then
            echo "::error::Trivy reported no HIGH/CRITICAL finding on alpine:3.12; a clean scan elsewhere proves nothing"
            exit 1
          fi
          echo "ok: the scanner goes red on a vulnerable image"

  lock-drift:
    name: Dependency downgrade check
    # A pull request has a base branch to diff against; a push to main
    # has the commit it replaced (`github.event.before`). Both are a
    # meaningful "before", so the check runs in both cases: a downgrade
    # that lands on main through a direct push is exactly the case
    # that matters. A push that creates the branch has no "before"
    # (it is all zeros) and is skipped -- there is nothing to compare.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history: the base commit's Cargo.lock is read with
          # `git show`, so the object has to be present.
          fetch-depth: 0

      # `--locked` only asserts the lock file agrees with the manifest. A
      # *downgrade* is a perfectly consistent lock file, so neither
      # `--locked` nor `cargo deny` catches one. This gate does.
      #
      # The check's semantics are pinned by its own self-test, which runs
      # first: a false positive here blocks legitimate pull requests,
      # and a false negative is the whole point of the check.
      - name: Self-test the downgrade check
        run: tools/lock-drift.py --selftest

      - name: Reject dependency downgrades
        if: >-
          ${{ !contains(github.event.pull_request.labels.*.name, 'supply-chain-ok') }}
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::no base commit to compare against; skipping the downgrade check"
            exit 0
          fi
          tools/lock-drift.py "$base" Cargo.lock
