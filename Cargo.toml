[package]
name = "llmproxy"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros", "json"] }
# tokio features are narrowed to what the code actually uses
# (macros/net/rt/rt-multi-thread/signal/sync/time). "full" additionally
# pulled in fs/process/parking_lot -- the parking_lot crate family is
# three packages that were compiled but never called.
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5"

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks", "gzip"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML parsing. `serde_yaml` is archived and pulls in the unmaintained
# `unsafe-libyaml` (RUSTSEC-2024-0449); `serde-saphyr` is a pure-Rust
# replacement (`#![forbid(unsafe_code)]`). See
# plans/fix-rustsec-2024-0449.md for the option-parity rationale.
serde-saphyr = { version = "2", default-features = false, features = ["deserialize", "serialize"] }

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
futures-util = "0.3"
bytes = "1"
memchr = "2"

# API keys are held in `SecretString` so that a `{:?}` of any config or
# provider never prints them. See plans/feat-vault-secret-backend.md
# (A-Phase 5).
#
# secrecy 0.10 reshaped the crate: `Secret<T>` is gone, `SecretString` is
# now `SecretBox<str>` (heap-allocated, `Zeroize`d on drop). The wire
# behaviour we depend on is unchanged: `SecretString` still does NOT
# implement `Serialize` (0.10 gates it behind an opt-in marker trait,
# `SerializableSecret`, that `str` cannot implement), so the redaction
# helpers in `src/config.rs` stay mandatory.
secrecy = { version = "0.10", features = ["serde"] }

# AES-256-GCM envelope encryption for the on-disk Copilot token store.
# `ring` was already in the tree as a rustls dependency; it is now a
# direct dependency too. `base64` encodes the envelope's nonce and
# ciphertext.
ring = "0.17"
base64 = "0.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Same narrowed feature set as the main dependency, plus "test-util" for
# tokio::time::advance. The tests never touch fs/process either.
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time", "test-util"] }
wiremock = "0.6"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Phase 2: per-binary ctor used to install a benign `tracing`
# subscriber at process start so tests don't fight over the global
# subscriber slot (see `src/tracing_capture.rs` for the callsite
# Interest cache rationale).
#
# ctor 1.0 requires every `#[ctor]` item to be marked unsafe: the
# constructor runs before `main`, where the usual Rust initialization
# guarantees don't hold. `#[ctor::ctor(unsafe)]` is that marker.
ctor = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
