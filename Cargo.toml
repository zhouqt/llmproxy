[package]
name = "llmproxy"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros", "json"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks", "gzip"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
bytes = "1"
memchr = "2"

# API keys are held in `SecretString` so that a `{:?}` of any config or
# provider never prints them. See plans/feat-vault-secret-backend.md
# (A-Phase 5).
secrecy = { version = "0.10", features = ["serde"] }

# AES-256-GCM envelope encryption for the on-disk Copilot token store.
# `ring` was already in the tree as a rustls dependency; it is now a
# direct dependency too. `base64` encodes the envelope's nonce and
# ciphertext.
ring = "0.17"
base64 = "0.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Phase 2: per-binary ctor used to install a benign `tracing`
# subscriber at process start so tests don't fight over the global
# subscriber slot (see `src/tracing_capture.rs` for the callsite
# Interest cache rationale).
ctor = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
