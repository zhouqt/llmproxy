# cargo-deny configuration.
#
# What this is and is NOT:
#   cargo-deny is a POLICY LINTER. It does not stop a malicious crate from
#   doing anything -- it reports things a human then has to look at. The
#   controls that actually stop things live in the Dockerfile (network
#   isolation for the compile step) and in Cargo.lock (byte-level pinning).
#   See plans/harden-cargo-deps.md for the measurements behind that split.
#
# What it is good for:
#   - a dependency with a known advisory is caught automatically
#   - a dependency with a surprising license is caught automatically
#   - a dependency from an unknown source (a git URL, a private registry)
#     is caught automatically -- and this one matters, because git/path
#     dependencies are NOT covered by Cargo.lock's sha256 checks
#
# Tool version this file was written against: cargo-deny 0.20.2.

[advisories]
# Every entry needs a written rationale next to it. An empty list means
# "no known vulnerability is tolerated".
ignore = []
# A yanked crate is a crate its author pulled. Depending on one is almost
# always a mistake.
yanked = "deny"

[bans]
# The graph currently carries more than one version of a few crates.
# "warn" first: it reports them without blocking, so the list can be
# worked down one crate at a time. Flip to "deny" once it is empty.
multiple-versions = "warn"
# A "*" version requirement can resolve to anything at any time.
wildcards = "deny"

[licenses]
# v2 syntax. There is no top-level "unknown" key in v2 -- a license that
# is not in `allow` is a hard error.
version = 2
# The list is exactly the licenses the current dependency set uses --
# an entry nobody uses is a licence that would be waved through if a
# future dependency brought it in. cargo-deny warns about unused
# entries, which is what keeps the list honest.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "Unlicense",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
]
clarify = []
# llmproxy is not published, so its own license field is irrelevant here.
private = { ignore = true }

[sources]
# A dependency from a registry we did not expect is a supply-chain
# problem by definition.
unknown-registry = "deny"
# A git dependency is fetched by URL at build time and is NOT pinned by
# Cargo.lock's checksums. This is the one that has to stay denied.
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
