services:
  llmproxy:
    build: .
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config.yaml:/etc/llmproxy/config.yaml:ro
      # TPM sealed chunks (ciphertext only), produced by deploy/seal.sh
      # into ./deploy/secrets/seal. See docs/tpm-sealed-secrets-deploy.md.
      - ./deploy/secrets/seal:/secrets/seal:ro
      # Fallback plaintext. KEEP THIS LINE COMMENTED OUT in normal
      # service: with the source file absent the bind-mount fails the
      # container, and with any content in the file the entrypoint
      # silently switches to fallback mode on the next recreate.
      # Uncomment only while ./deploy/secrets/llmproxy.env actually
      # exists (TPM path broken), and comment it again afterwards.
      # - ./deploy/secrets/llmproxy.env:/secrets/llmproxy.env:ro
      - llmproxy-data:/root/.local/share/llmproxy

    # The unsealed secrets MUST land on a tmpfs. podman gives the
    # container a tmpfs at /run by default (measured on podman 5.4.2,
    # rootless), but this entry is what pins its options -- noexec,
    # nosuid, nodev and a 4 MB ceiling -- instead of leaving them to a
    # runtime default that a version bump could change. The entrypoint
    # checks the target directory's mount before writing, so the
    # guarantee does not rest on this line alone.
    #
    # The payload lives under /run/llmproxy/ and NOT under /run/secrets/:
    # podman mounts its own per-container directories at /run/secrets and
    # /run/.containerenv, and with `read_only: true` below podman forces
    # those mounts read-only. They then shadow the rw /run tmpfs, and
    # writing the unsealed payload to /run/secrets fails with EROFS even
    # though /run itself is writable.
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,size=4m
      # The entrypoint's TPM unseal needs one scratch file (the loaded
      # policy session). It sits next to the payload, in /run/llmproxy/,
      # so the /run tmpfs above covers it: the same no-plaintext-on-disk
      # guarantee as the payload itself.
      #
      # /tmp is here for the process, not for the secrets: with
      # `read_only` below the rootfs has no writable layer at all, and a
      # program that wants a scratch directory (/tmp is the usual
      # answer) would fail without this. Nothing the proxy writes there
      # is secret, and the mount is noexec/nosuid/nodev.
      - /tmp:rw,noexec,nosuid,nodev,size=4m

    # Hardening (security audit L5): the proxy is a self-contained Rust
    # binary that needs no privileges beyond its bind-mounts, the TPM
    # device, and the two tmpfs mounts above.
    # - read_only: an exploited process cannot persist a payload or
    #   tamper with the image; everything it may legitimately write
    #   (token store, /run, /tmp) lives on a volume or tmpfs.
    # - cap_drop ALL: rootless podman grants no capabilities that the
    #   binary uses; /dev/tpmrm0 access rides on keep-groups below
    #   (0660 + tss group), not on any capability.
    # - no-new-privileges: even if something in the container could
    #   exec a setuid helper, it would not gain more than it has.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges

    # TPM access for the in-container unseal. The entrypoint refuses to
    # run in TPM mode if /run is not a tmpfs.
    devices:
      - /dev/tpmrm0:/dev/tpmrm0
    # keep-groups (crun only) carries the host's supplementary groups --
    # notably `tss`, which owns /dev/tpmrm0 0660 -- into the container.
    # A numeric gid would be re-mapped to a subgid instead. The
    # annotation is crun's equivalent spelling; either one alone works.
    group_add:
      - keep-groups
    annotations:
      run.oci.keep_original_groups: "1"

    # NOTE: no `env_file: .env` -- that would put every API key into
    # `podman inspect`'s Config.Env. Secrets reach the proxy through
    # /run/llmproxy/llmproxy.env (see config.yaml `secrets:` block).
    #
    # `${RUST_LOG}` below is interpolated from the host environment (or
    # a .env file, for interpolation only); it is NOT injected as
    # container environment.
    environment:
      # Non-secret defaults only.
      #
      # Log level is controlled solely by RUST_LOG (there is no logging
      # section in config.yaml). Defaults to "info"; raise to
      # "llmproxy=debug" (or "llmproxy=trace") to debug routing/cache
      # internals. See README "Logging".
      - RUST_LOG=${RUST_LOG:-info}
      # Where the entrypoint writes the unsealed payload. Must match the
      # `secrets.file.path` in config.yaml. Kept off podman's reserved
      # /run/secrets -- see the tmpfs comment above.
      - LLMPROXY_KEYS=/run/llmproxy/llmproxy.env

    # The image already declares ENTRYPOINT entrypoint.sh; do not repeat
    # it here. podman-compose 1.3 drops the image CMD whenever the
    # compose file sets `entrypoint:`, which leaves the entrypoint with
    # no command to exec -- it then exits 0 and the container
    # restart-loops with nothing in the log. Spelling the command out
    # keeps this independent of the image's CMD.
    command: ["llmproxy", "--config", "/etc/llmproxy/config.yaml"]
    restart: unless-stopped

volumes:
  llmproxy-data:
