# Sandbox canary -- a compile-time isolation self-check
#
# This crate's build.rs actively probes whether the build environment is isolated:
# 1. Can it reach the network?
# 2. Does the environment hold credential variables that must not be there?
#
# As soon as a breach is detected the build fails -- the goal is to make "isolation is broken"
# a **build failure that is visible right away**, instead of something you only find out about later.
#
# It is a separate workspace (the `[workspace]` table below), not part of the main
# workspace, so `cargo build` / `cargo test` / `cargo llvm-cov` never touch it.
#
# Usage:
#   Isolated environment (expected to pass): cargo build --manifest-path tools/sandbox-canary/Cargo.toml
#   network reachable (expected to FAIL): same command -- there is no
#   switch; a failure is a failure.
#
# Environment-variable rules (build.rs):
#   violation: a variable whose name contains PROXY (HTTP_PROXY / HTTPS_PROXY /
#           ALL_PROXY and their lower-case variants, and any other *PROXY*),
#           because a proxy can re-route the compile-time egress.
#   violation: credential-shaped variables (GITHUB_TOKEN / AWS_* / *_API_KEY /
#           SSH_AUTH_SOCK, ...), see FORBIDDEN_ENV in build.rs.
#   NOT a violation: `NO_PROXY` / `no_proxy`. It is the exclusion list of
#           "hosts that must bypass the proxy": not an egress, not a
#           credential. `run_in_container()` in tools/cargo-in-container.sh injects
#           `-e NO_PROXY=...` / `-e no_proxy=...` unconditionally (the test
#           suite talks to mock servers on 127.0.0.1), so excluding it keeps
#           the canary from reporting a false positive on every local run,
#           and a check that is always red is a check people skip.
#   Only variable names are inspected; values are never printed.
[package]
name = "sandbox-canary"
version = "0.1.0"
edition = "2021"
publish = false

# Separate workspace: keep the repository root's workspace from absorbing it.
[workspace]

[dependencies]
